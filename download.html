const langMeta = {
  "zh-CN": { flag: "🇨🇳", label: "简体中文" },
  "zh-TW": { flag: "🇨🇳", label: "繁體中文" },
  "en": { flag: "🇺🇸", label: "English" },
  "ja": { flag: "🇯🇵", label: "日本語" },
  "ko": { flag: "🇰🇷", label: "한국어" }
};

function getTimezone() {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || null;
  } catch (e) {
    return null;
  }
}

function langFromTimezone(tz) {
  if (!tz) return null;
  if (["Asia/Taipei", "Asia/Hong_Kong", "Asia/Macau"].includes(tz)) return "zh-TW";
  if (["Asia/Shanghai", "Asia/Chongqing", "Asia/Urumqi", "Asia/Harbin"].includes(tz)) return "zh-CN";
  if (tz === "Asia/Tokyo") return "ja";
  if (["Asia/Seoul", "Asia/Pyongyang"].includes(tz)) return "ko";
  if (tz.startsWith("Europe/") || tz.startsWith("America/") || tz.startsWith("Africa/") || tz.startsWith("Australia/") || tz.startsWith("Pacific/")) return "en";
  return null;
}

function matchLangTag(tag) {
  if (!tag) return null;
  const value = String(tag).toLowerCase().replace(/_/g, "-");
  if (value.startsWith("zh-tw") || value.startsWith("zh-hk") || value.startsWith("zh-mo") || value === "zh-hant") return "zh-TW";
  if (value.startsWith("zh-cn") || value.startsWith("zh-sg") || value === "zh-hans") return "zh-CN";
  if (value.startsWith("ja")) return "ja";
  if (value.startsWith("ko")) return "ko";
  if (value.startsWith("en")) return "en";
  return null;
}

function detectLangFromSystem() {
  const tags = navigator.languages && navigator.languages.length ? Array.from(navigator.languages) : [navigator.language || ""];
  const timezoneLang = langFromTimezone(getTimezone());

  for (const tag of tags) {
    const matched = matchLangTag(tag);
    if (matched) return matched;
  }

  for (const tag of tags) {
    if (String(tag).toLowerCase().startsWith("zh")) return timezoneLang === "zh-TW" ? "zh-TW" : "zh-CN";
  }

  return timezoneLang || "en";
}

function applyLang(lang, persist) {
  const dict = i18n[lang];
  if (!dict) return;
  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    const key = el.getAttribute("data-i18n");
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  document.querySelectorAll("[data-i18n-aria-label]").forEach(function(el) {
    const key = el.getAttribute("data-i18n-aria-label");
    if (dict[key] !== undefined) el.setAttribute("aria-label", dict[key]);
  });
  document.documentElement.lang = lang;
  document.title = dict.page_title;
  const meta = langMeta[lang];
  document.getElementById("langFlag").textContent = meta.flag;
  document.getElementById("langLabel").textContent = meta.label;
  document.querySelectorAll(".lang-option").forEach(function(option) {
    const active = option.dataset.lang === lang;
    option.classList.toggle("active", active);
    if (active) option.setAttribute("aria-current", "true");
    else option.removeAttribute("aria-current");
  });
  if (persist !== false) {
    try { localStorage.setItem("vauldy_lang", lang); } catch (e) {}
  }
}

function toggleLangDropdown() {
  const button = document.getElementById("langBtn");
  const dropdown = document.getElementById("langDropdown");
  const shouldOpen = !dropdown.classList.contains("open");
  dropdown.classList.toggle("open", shouldOpen);
  button.classList.toggle("open", shouldOpen);
  button.setAttribute("aria-expanded", String(shouldOpen));
}

function setLang(lang) {
  applyLang(lang);
  closeLangDropdown();
}

function closeLangDropdown() {
  document.getElementById("langDropdown").classList.remove("open");
  document.getElementById("langBtn").classList.remove("open");
  document.getElementById("langBtn").setAttribute("aria-expanded", "false");
}

document.addEventListener("click", function(event) {
  const switcher = document.querySelector(".lang-switcher");
  if (switcher && !switcher.contains(event.target)) closeLangDropdown();
});

(function initTabs() {
  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));

  function activateTab(tab, moveFocus) {
    tabs.forEach(function(item) {
      const active = item === tab;
      item.classList.toggle("active", active);
      item.setAttribute("aria-selected", String(active));
      item.tabIndex = active ? 0 : -1;
      document.getElementById(item.getAttribute("aria-controls")).hidden = !active;
    });
    if (moveFocus) tab.focus();
  }

  tabs.forEach(function(tab, index) {
    tab.addEventListener("click", function() { activateTab(tab, false); });
    tab.addEventListener("keydown", function(event) {
      let targetIndex = null;
      if (event.key === "ArrowRight") targetIndex = (index + 1) % tabs.length;
      if (event.key === "ArrowLeft") targetIndex = (index - 1 + tabs.length) % tabs.length;
      if (event.key === "Home") targetIndex = 0;
      if (event.key === "End") targetIndex = tabs.length - 1;
      if (targetIndex !== null) {
        event.preventDefault();
        activateTab(tabs[targetIndex], true);
      }
    });
  });
})();

(function init() {
  let saved;
  try { saved = localStorage.getItem("vauldy_lang"); } catch (e) {}
  applyLang(saved && i18n[saved] ? saved : detectLangFromSystem(), Boolean(saved && i18n[saved]));
})();
